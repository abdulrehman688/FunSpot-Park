  <script>
    function myFun(){

      var numbers = /^[0-9]+$/;


      var correct_way = /^[A-Za-z- ]+$/;

      var xyz = /^[Send Now]+$/;
      var a = document.getElementById("User_Name").value;
      var b = document.getElementById("phone_number").value;
      var c = document.getElementById("Submit").value;

   
      if(a.match(correct_way))
        true; 
        else{ 
          swal({
            title: "Oops!",
            text: "Please input Alphabets only, eg: Abdul Rehman.",
            icon: "error",
            button: "Ok Done!",
            });
        return false;
      }

      if(b.match(numbers))
      true;
      else{
        swal({
              title: "Oops!",
              text: "Please input numeric characters only, eg: 0300-1234567.",
              icon: "error",
              button: "Ok Done!",
              });
        return false;
      }

      if(c.match(xyz))
      swal({
            title: "Oops!",
            text: "Please input Alphabets only, eg: Abdul Rehman.",
            icon: "error",
            button: "Ok Done!",
            });
            true;


     
      
    }
